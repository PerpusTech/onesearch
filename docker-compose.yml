services:
  web:
    build: .
    container_name: ums-onesearch
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      # Mount data/ agar bisa rebuild tanpa rebuild image
      - ./data:/usr/share/nginx/html/data:ro
    environment:
      - TZ=Asia/Jakarta

  api_proxy:
    build: ./proxy
    container_name: ums-onesearch-proxy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
