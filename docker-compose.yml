services:
  web:
    build: .
    container_name: ums-onesearch
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - .:/usr/share/nginx/html:ro
    environment:
      - TZ=Asia/Jakarta

  api_proxy:
    build: ./proxy
    container_name: ums-onesearch-proxy
    restart: unless-stopped
    command: gunicorn -b 0.0.0.0:5000 -w 1 --threads 16 --timeout 120 --chdir /app/proxy app:app
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
      - PYTHONUNBUFFERED=1

  scheduler:
    build: ./proxy
    container_name: ums-onesearch-scheduler
    restart: unless-stopped
    command: python -u /app/scripts/scheduler.py
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
      - PYTHONUNBUFFERED=1

